---
# Attempts an SSH login to a server.
# Generic reusable playbook — takes a hostname/IP and tries to log in.
#
# Takes: server_name, server_ip
# Publishes: server_ready (true/false)
#
# The job template inventory stays Demo Inventory. The instance is added
# for this run only from server_ip. The Demo SSH Key machine credential
# supplies ec2-user and the private key for that connection.

- name: Add the provisioned server
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Validate required parameters
      ansible.builtin.assert:
        that:
          - server_name is defined
          - server_ip is defined
        fail_msg: "server_name and server_ip must be provided"

    - name: Add the new server for this run
      ansible.builtin.add_host:
        name: "{{ server_ip }}"
        groups: provisioned_server
        ansible_user: ec2-user
        ansible_ssh_timeout: 3
        ansible_ssh_common_args: >-
          -o BatchMode=yes
          -o ConnectTimeout=3
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null

- name: Attempt SSH login
  hosts: provisioned_server
  gather_facts: false

  tasks:
    - name: SSH login
      ansible.builtin.raw: echo ready
      register: ssh_login
      ignore_errors: true
      ignore_unreachable: true
      changed_when: false

    - name: Record readiness
      ansible.builtin.set_fact:
        server_ready: "{{ ssh_login.rc | default(1) == 0 }}"
        ssh_error: "{{ ssh_login.msg | default(ssh_login.stderr) | default('') }}"
      delegate_to: localhost
      delegate_facts: true

- name: Publish readiness
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Determine readiness
      ansible.builtin.set_fact:
        _ready: "{{ hostvars['localhost'].server_ready | default(false) }}"

    - name: Server not ready yet
      ansible.builtin.debug:
        msg: >-
          ⏳ Server {{ server_name }} ({{ server_ip }}) — SSH login failed
          ({{ hostvars['localhost'].ssh_error | default('unreachable') | trim }})
      when: not _ready | bool

    - name: Server is ready
      ansible.builtin.debug:
        msg: "✅ Server {{ server_name }} ({{ server_ip }}) — SSH login succeeded"
      when: _ready | bool

    - name: Publish readiness status
      ansible.builtin.set_stats:
        data:
          server_ready: "{{ 'true' if (_ready | bool) else 'false' }}"
        aggregate: false
