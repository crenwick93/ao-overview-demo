---
# Generates a markdown onboarding report for the audit trail.
# The report content is published via set_stats for the Git commit step.
# In production, this could pull real data from each service API.
#
# Takes: server_name, server_ip, environment, os_type, cr_number, validation_report
# Publishes: report_content, report_file_path

- name: Generate Onboarding Report
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Validate required parameters
      ansible.builtin.assert:
        that:
          - server_name is defined
          - server_ip is defined
          - environment is defined
        fail_msg: "server_name, server_ip, and environment must be provided"

    - name: Build markdown report
      ansible.builtin.set_fact:
        _report_content: |
          # Server Onboarding Report

          ## Summary
          | Field | Value |
          |-------|-------|
          | Server | {{ server_name }} |
          | IP Address | {{ server_ip }} |
          | FQDN | {{ server_name }}.{{ environment }}.example.com |
          | OS | {{ os_type | default('RHEL 9') }} |
          | Environment | {{ environment }} |
          | Change Request | {{ cr_number | default('N/A') }} |
          | Date | {{ ansible_date_time.iso8601 }} |

          ## Service Registrations
          | Service | Status |
          |---------|--------|
          | DNS | ✅ Registered |
          | Monitoring | ✅ Registered |
          | CMDB | ✅ Registered |
          | Backup | ✅ Registered |

          ## Validation
          {{ validation_report | default('All checks passed.') }}

          ## Audit Trail
          - Workflow triggered by ServiceNow request
          - AI classified server requirements
          - Change request created for governance
          - Server provisioned and registered in all services
          - Post-provisioning validation passed
          - Report committed to Git as evidence

          ---
          *Generated by AO Server Onboarding Workflow*

    - name: Display report
      ansible.builtin.debug:
        msg: "{{ _report_content }}"

    - name: Publish report artifacts
      ansible.builtin.set_stats:
        data:
          report_content: "{{ _report_content }}"
          report_file_path: "reports/{{ server_name }}-onboarding-{{ ansible_date_time.date }}.md"
        aggregate: false
