---
# Simulates server provisioning for the AO Overview Demo.
# In production, replace with your real vSphere/OpenShift/cloud provisioning playbook.
#
# Takes: server_name, os_type, environment, ritm_sys_id (optional)
# Publishes: server_ip, server_fqdn, provision_status

- name: Simulate Server Provisioning
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Validate required parameters
      ansible.builtin.assert:
        that:
          - server_name is defined
          - os_type is defined
          - environment is defined
        fail_msg: "server_name, os_type, and environment must be provided"

    - name: Display provisioning request
      ansible.builtin.debug:
        msg: |
          ══════════════════════════════════════════
           Provisioning Server
          ══════════════════════════════════════════
           Server:      {{ server_name }}
           OS:          {{ os_type }}
           Environment: {{ environment }}
          ══════════════════════════════════════════

    - name: Simulate provisioning delay
      ansible.builtin.pause:
        seconds: 5
        prompt: "Provisioning {{ server_name }} ({{ os_type }}) in {{ environment }}..."

    - name: Display provisioning result
      ansible.builtin.debug:
        msg: |
          ✅ Server {{ server_name }} provisioned successfully
             IP:   10.0.42.100
             FQDN: {{ server_name }}.{{ environment }}.example.com

    - name: Update RITM work notes
      servicenow.itsm.api:
        resource: sc_req_item
        action: patch
        sys_id: "{{ ritm_sys_id }}"
        data:
          work_notes: "[code]<h3>Server Provisioned</h3><p>Server: {{ server_name }}<br>IP: 10.0.42.100<br>FQDN: {{ server_name }}.{{ environment }}.example.com<br>Status: success</p>[/code]"
      when: ritm_sys_id is defined and ritm_sys_id | length > 0

    - name: Publish provisioning artifacts
      ansible.builtin.set_stats:
        data:
          server_ip: "10.0.42.100"
          server_fqdn: "{{ server_name }}.{{ environment }}.example.com"
          provision_status: "success"
        aggregate: false
