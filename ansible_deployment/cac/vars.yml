---
# =============================================================================
# AAP Configuration as Code — AO Overview Demo (Server Onboarding)
# =============================================================================

# -----------------------------------------------------------------------------
# Organizations
# -----------------------------------------------------------------------------
aap_organizations:
  - name: "Default"
    description: "The default organization for Ansible Automation Platform"
  - name: "Network Engineering"
    description: "Network change automation — firewall rules, routing, and connectivity"

# -----------------------------------------------------------------------------
# Custom Credential Types
# -----------------------------------------------------------------------------
controller_credential_types:
  - name: "ServiceNow Credential"
    description: "ServiceNow instance credentials for ITSM API"
    kind: cloud
    inputs:
      fields:
        - id: SN_HOST
          type: string
          label: "ServiceNow Instance URL"
        - id: SN_USERNAME
          type: string
          label: "Username"
        - id: SN_PASSWORD
          type: string
          label: "Password"
          secret: true
    injectors:
      env:
        SN_HOST: !unsafe "{{ SN_HOST }}"
        SN_USERNAME: !unsafe "{{ SN_USERNAME }}"
        SN_PASSWORD: !unsafe "{{ SN_PASSWORD }}"

  - name: "AO Webhook Credential"
    description: "OAuth2 service account for Automation Orchestrator EDA trigger"
    kind: cloud
    inputs:
      fields:
        - id: webhook_base_url
          type: string
          label: "AO Base URL"
        - id: webhook_client_id
          type: string
          label: "Service Account Client ID"
        - id: webhook_client_secret
          type: string
          label: "Service Account Client Secret"
          secret: true
    injectors:
      extra_vars:
        webhook_base_url: !unsafe "{{ webhook_base_url }}"
        webhook_client_id: !unsafe "{{ webhook_client_id }}"
        webhook_client_secret: !unsafe "{{ webhook_client_secret }}"

# -----------------------------------------------------------------------------
# Credentials
# -----------------------------------------------------------------------------
controller_credentials:
  - name: "ServiceNow ITSM"
    description: "ServiceNow instance for incident management"
    organization: "Default"
    credential_type: "ServiceNow Credential"
    inputs:
      SN_HOST: "{{ sn_instance }}"
      SN_USERNAME: "{{ sn_username }}"
      SN_PASSWORD: "{{ sn_password }}"

  - name: "AAP Controller"
    description: "Controller credential for internal workflow operations"
    organization: "Default"
    credential_type: "Red Hat Ansible Automation Platform"
    inputs:
      host: "{{ (aap_hostname | regex_replace('/+$','')) ~ '/api/controller/' }}"
      oauth_token: "{{ aap_token }}"
      verify_ssl: "{{ aap_validate_certs }}"

  - name: "AO Webhook"
    description: "OAuth2 credentials for AO EDA trigger endpoint"
    organization: "Default"
    credential_type: "AO Webhook Credential"
    inputs:
      webhook_base_url: "{{ ao_webhook_base_url }}"
      webhook_client_id: "{{ ao_webhook_client_id }}"
      webhook_client_secret: "{{ ao_webhook_client_secret }}"

  - name: "AWS"
    description: "AWS credentials for EC2 provisioning"
    organization: "Default"
    credential_type: "Amazon Web Services"
    inputs:
      username: "{{ aws_access_key_id }}"
      password: "{{ aws_secret_access_key }}"

  - name: "Demo SSH Key"
    description: "patching-demo key pair used to SSH to demo EC2 instances"
    organization: "Default"
    credential_type: "Machine"
    inputs:
      username: "ec2-user"
      ssh_key_data: "{{ ssh_private_key }}"

# -----------------------------------------------------------------------------
# Inventories
# -----------------------------------------------------------------------------
controller_inventories:
  - name: "Demo Inventory"
    description: "Default inventory for AO workflow job templates"
    organization: "Default"

  - name: "Network Inventory"
    description: "Localhost inventory for network change jobs"
    organization: "Network Engineering"

controller_hosts:
  - name: "localhost"
    inventory: "Network Inventory"
    variables:
      ansible_connection: local

# -----------------------------------------------------------------------------
# Projects
# -----------------------------------------------------------------------------
controller_projects:
  - name: "AO Overview Demo"
    description: "Server onboarding playbooks for AO Overview Demo"
    organization: "Default"
    scm_type: "git"
    scm_url: "{{ git_repo_url }}"
    scm_branch: "main"
    scm_update_on_launch: true

  - name: "Network Change Playbooks"
    description: "Firewall and network change playbooks"
    organization: "Network Engineering"
    scm_type: "git"
    scm_url: "{{ git_repo_url }}"
    scm_branch: "main"
    scm_update_on_launch: true

# -----------------------------------------------------------------------------
# Job Templates
# -----------------------------------------------------------------------------
controller_templates:
  - name: "AO Workflow Bridge"
    description: >-
      EDA-to-AO bridge: obtains OAuth2 token and POSTs event payload
      to the AO EDA trigger endpoint.
    organization: "Default"
    job_type: "run"
    project: "AO Overview Demo"
    playbook: "playbooks/trigger_ao_workflow.yml"
    inventory: "Demo Inventory"
    ask_variables_on_launch: true
    extra_vars:
      webhook_path: null
      event_payload: null
    credentials:
      - "AO Webhook"

  - name: "Manage SNOW Request"
    description: >-
      ServiceNow service request item (RITM) operations: update work notes, close.
      Pass action=update|close in extra_vars.
    organization: "Default"
    job_type: "run"
    project: "AO Overview Demo"
    playbook: "playbooks/manage_snow_request.yml"
    inventory: "Demo Inventory"
    ask_variables_on_launch: true
    extra_vars:
      action: null
      ritm_sys_id: null
      work_notes: null
    credentials:
      - "ServiceNow ITSM"

  - name: "Provision Server"
    description: >-
      Launches a real EC2 instance (RHEL 9, t3.micro).
      Publishes server_ip, instance_id, provision_status via set_stats.
      Updates RITM work notes if ritm_sys_id is provided.
    organization: "Default"
    job_type: "run"
    project: "AO Overview Demo"
    playbook: "playbooks/provision_server.yml"
    inventory: "Demo Inventory"
    ask_variables_on_launch: true
    extra_vars:
      server_name: null
      os_type: null
      environment: null
      ritm_sys_id: null
    credentials:
      - "ServiceNow ITSM"
      - "AWS"

  - name: "Check Server Ready"
    description: >-
      Attempts an SSH login to a server. Used inside a While loop.
      Publishes server_ready via set_stats.
    organization: "Default"
    job_type: "run"
    project: "AO Overview Demo"
    playbook: "playbooks/check_server_ready.yml"
    inventory: "Demo Inventory"
    ask_variables_on_launch: true
    extra_vars:
      server_name: null
      server_ip: null
    credentials:
      - "Demo SSH Key"

  - name: "Register Service"
    description: >-
      Simulates registering a server in an infrastructure service.
      Called 4x in parallel: service_name=dns|monitoring|cmdb|backup.
      Updates RITM work notes if ritm_sys_id is provided.
    organization: "Default"
    job_type: "run"
    project: "AO Overview Demo"
    playbook: "playbooks/register_service.yml"
    inventory: "Demo Inventory"
    ask_variables_on_launch: true
    extra_vars:
      service_name: null
      server_name: null
      server_ip: null
      ritm_sys_id: null
    credentials:
      - "ServiceNow ITSM"

  - name: "Validate Server"
    description: >-
      Post-provisioning validation. Checks DNS, monitoring, CMDB, backup.
      Publishes validation_passed, validation_report via set_stats.
      Updates RITM work notes if ritm_sys_id is provided.
    organization: "Default"
    job_type: "run"
    project: "AO Overview Demo"
    playbook: "playbooks/validate_server.yml"
    inventory: "Demo Inventory"
    ask_variables_on_launch: true
    extra_vars:
      server_name: null
      server_ip: null
      ritm_sys_id: null
    credentials:
      - "ServiceNow ITSM"

  - name: "Manage Firewall Rules"
    description: >-
      Stub: simulates allowing or denying traffic between two networks.
      Survey asks for source/destination CIDR, port, protocol, action,
      and the related ServiceNow incident number. Debug output only.
    organization: "Network Engineering"
    job_type: "run"
    project: "Network Change Playbooks"
    playbook: "playbooks/manage_firewall_rules.yml"
    inventory: "Network Inventory"
    ask_variables_on_launch: false
    survey_enabled: true
    survey_spec:
      name: "Manage Firewall Rules"
      description: "Provide the networks, port, action, and related ServiceNow incident."
      spec:
        - question_name: "Incident number"
          question_description: "Related ServiceNow incident (e.g. INC0010007)"
          required: true
          type: text
          variable: incident_number
          min: 3
          max: 32
          default: ""
          choices: ""
          new_question: true
        - question_name: "Source network"
          question_description: "Source CIDR (e.g. 10.10.20.0/24)"
          required: true
          type: text
          variable: source_network
          min: 7
          max: 64
          default: ""
          choices: ""
          new_question: true
        - question_name: "Destination network"
          question_description: "Destination CIDR (e.g. 10.50.1.0/24)"
          required: true
          type: text
          variable: destination_network
          min: 7
          max: 64
          default: ""
          choices: ""
          new_question: true
        - question_name: "Destination port"
          question_description: "Port to open (1-65535). Use 0 for ICMP."
          required: true
          type: integer
          variable: destination_port
          min: 0
          max: 65535
          default: 443
          choices: ""
          new_question: true
        - question_name: "Protocol"
          question_description: "IP protocol for the rule"
          required: true
          type: multiplechoice
          variable: protocol
          min: null
          max: null
          default: tcp
          choices: |-
            tcp
            udp
            icmp
          new_question: true
        - question_name: "Action"
          question_description: "Allow or deny the traffic"
          required: true
          type: multiplechoice
          variable: action
          min: null
          max: null
          default: allow
          choices: |-
            allow
            deny
          new_question: true
        - question_name: "Direction"
          question_description: "Traffic direction relative to the destination network"
          required: true
          type: multiplechoice
          variable: direction
          min: null
          max: null
          default: bidirectional
          choices: |-
            inbound
            outbound
            bidirectional
          new_question: true
        - question_name: "Business justification"
          question_description: "Why this rule is required"
          required: true
          type: textarea
          variable: justification
          min: 5
          max: 1024
          default: ""
          choices: ""
          new_question: true


# =============================================================================
# Event-Driven Ansible
# =============================================================================

eda_credential_types:
  - name: "ServiceNow Credential"
    description: "ServiceNow instance credentials for EDA source plugins"
    inputs:
      fields:
        - id: SN_HOST
          type: string
          label: "ServiceNow Instance URL"
        - id: SN_USERNAME
          type: string
          label: "Username"
        - id: SN_PASSWORD
          type: string
          label: "Password"
          secret: true
    injectors:
      env:
        SN_HOST: !unsafe "{{ SN_HOST }}"
        SN_USERNAME: !unsafe "{{ SN_USERNAME }}"
        SN_PASSWORD: !unsafe "{{ SN_PASSWORD }}"

eda_decision_environments:
  - name: "ServiceNow DE"
    description: "Decision environment with servicenow.itsm for SNOW polling"
    organization: "Default"
    image_url: "quay.io/crenwick93/snow-de:latest"

eda_projects:
  - name: "AO Overview Demo"
    description: "EDA rulebooks for server onboarding"
    organization: "Default"
    url: "{{ git_repo_url }}"
    wait: true

eda_credentials:
  - name: "AAP Controller Token"
    description: "Controller credential so EDA can launch job templates"
    credential_type: "Red Hat Ansible Automation Platform"
    organization: "Default"
    inputs:
      host: "{{ (aap_hostname | regex_replace('/+$','')) ~ '/api/controller/' }}"
      oauth_token: "{{ aap_token }}"
      verify_ssl: false

  - name: "ServiceNow EDA"
    description: "ServiceNow credentials for the EDA records source plugin"
    credential_type: "ServiceNow Credential"
    organization: "Default"
    inputs:
      SN_HOST: "{{ sn_instance }}"
      SN_USERNAME: "{{ sn_username }}"
      SN_PASSWORD: "{{ sn_password }}"

eda_rulebook_activations:
  - name: "ao-overview-demo-events"
    description: "Monitor ServiceNow for server onboarding requests"
    organization: "Default"
    project: "AO Overview Demo"
    rulebook: "server_onboarding.yml"
    decision_environment: "ServiceNow DE"
    enabled: true
    extra_vars:
      webhook_path: "{{ ao_webhook_path }}"
    eda_credentials:
      - "AAP Controller Token"
      - "ServiceNow EDA"
