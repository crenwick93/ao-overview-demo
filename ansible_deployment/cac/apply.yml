---
- name: Apply AAP objects — AO Overview Demo
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - infra.aap_configuration

  vars:
    aap_hostname: "{{ lookup('env', 'AAP_HOSTNAME') | default(omit, true) }}"
    aap_token: "{{ lookup('env', 'AAP_TOKEN') | default(omit, true) }}"
    aap_validate_certs: "{{ (lookup('env', 'AAP_VALIDATE_CERTS') | default('false', true)) | bool }}"

    controller_host: "{{ aap_hostname }}"
    controller_oauthtoken: "{{ aap_token }}"
    controller_validate_certs: "{{ aap_validate_certs }}"

    aap_configuration_secure_logging: false
    aap_configuration_collect_logs: true
    aap_configuration_async_retries: 60
    aap_configuration_async_delay: 5

    # ServiceNow (supports both SN_ and SERVICENOW_ env var naming)
    sn_instance: "{{ lookup('env', 'SERVICENOW_INSTANCE_URL') | default(lookup('env', 'SN_INSTANCE'), true) | default(omit, true) }}"
    sn_username: "{{ lookup('env', 'SERVICENOW_USERNAME') | default(lookup('env', 'SN_USERNAME'), true) | default(omit, true) }}"
    sn_password: "{{ lookup('env', 'SERVICENOW_PASSWORD') | default(lookup('env', 'SN_PASSWORD'), true) | default(omit, true) }}"

    # AO API Service Account (for approval bridge)
    ao_sa_client_id: "{{ lookup('env', 'AO_SA_CLIENT_ID') | default('placeholder', true) }}"
    ao_sa_client_secret: "{{ lookup('env', 'AO_SA_CLIENT_SECRET') | default('placeholder', true) }}"
    ao_base_url: "{{ lookup('env', 'AO_WEBHOOK_BASE_URL') | default(omit, true) }}"

    # GitHub
    github_repo: "{{ lookup('env', 'GITHUB_REPO') | default('crenwick93/ao-overview-demo', true) }}"
    git_repo_url: "{{ 'https://github.com/' ~ github_repo ~ '.git' }}"
    github_token: "{{ lookup('env', 'GITHUB_TOKEN') | default('placeholder', true) }}"

  vars_files:
    - vars.yml
  roles:
    - role: infra.aap_configuration.dispatch
