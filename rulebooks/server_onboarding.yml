---
# EDA rulebook for AO Overview Demo — Server Onboarding.
#
# Polls ServiceNow for new service request items (RITMs) matching
# "Server Onboarding" and triggers the AO workflow.
#
# Requires a Decision Environment with servicenow.itsm.

- name: Monitor ServiceNow for server onboarding requests
  hosts: all
  execution_strategy: parallel
  sources:
    - servicenow.itsm.records:
        table: sc_req_item
        interval: 10
        remote_servicenow_timezone: "Europe/London"
        sysparm_query: >
          ORDERBYDESCsys_updated_on^ORDERBYDESCsys_id
      filters:
        - ansible.eda.json_filter:
        - ansible.eda.normalize_keys:
  rules:
    - name: Trigger AO server onboarding workflow
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - sys_id
      condition: event.short_description is match("Server Onboarding", ignorecase=true)
      action:
        run_job_template:
          name: AO Workflow Bridge
          organization: Default
          post_events: true
          job_args:
            extra_vars:
              webhook_path: "{{ webhook_path }}"
              event_payload:
                server_name: "{{ event.short_description.split(':', 1)[-1].split(',')[0] | trim }}"
                environment: "{{ (event.short_description.split(',')[1] | trim | lower) if (',' in event.short_description) else 'dev' }}"
                os_type: "{{ (event.short_description.split(',')[2] | trim) if (event.short_description.count(',') > 1) else 'RHEL 9' }}"
                application: "{{ (event.short_description.split(',')[3] | trim) if (event.short_description.count(',') > 2) else 'PostgreSQL' }}"
                ritm_number: "{{ event.number }}"
                ritm_sys_id: "{{ event.sys_id }}"
